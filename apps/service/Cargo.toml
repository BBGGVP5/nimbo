[package]
name = "nimbo-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Nimbo Windows service (TUN, core management, IPC)"

[[bin]]
name = "nimbo-svc"
path = "src/main.rs"

[dependencies]
nimbo-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
sha2.workspace = true
uuid = { workspace = true, features = ["serde"] }

[build-dependencies]
sha2.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# geteuid для проверки root; всё остальное делается через ip/systemctl.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.41", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Rpc",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_Com",
] }
