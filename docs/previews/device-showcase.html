<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>Nimbo — превью дизайна</title>
<link rel="stylesheet" href="../../apps/ui/src/assets/fonts/fonts.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1800px;height:1100px;overflow:hidden;background:#0e0e10;color:#eee;font-family:'Golos Text',sans-serif}.stage{height:100%;padding:62px 66px;background:radial-gradient(ellipse at 45% 70%,#27272b 0,transparent 62%)}header{display:flex;align-items:center;gap:20px;height:66px}header img{width:64px;height:64px}header strong{font:700 52px Manrope,sans-serif;letter-spacing:-2px}.devices{display:flex;align-items:flex-end;gap:44px;margin-top:40px}.device{position:relative}.label{color:#bbb;letter-spacing:2px;font-size:17px;text-align:center;margin-bottom:20px}.monitor{width:964px}.monitor-bezel{border-radius:24px;padding:12px 12px 22px;background:linear-gradient(135deg,#666,#17171a 20%,#070709 80%,#49494b);box-shadow:0 32px 65px #0009,inset 0 0 0 1px #7778}.monitor img{display:block;width:100%;height:auto;border-radius:13px;background:#111}.monitor-chin{height:12px;display:flex;align-items:center;justify-content:center}.monitor-chin i{display:block;width:3px;height:3px;border-radius:50%;background:#777;margin-top:11px}.stand{width:110px;height:76px;margin:auto;background:linear-gradient(90deg,#1c1c1f,#515157 50%,#252529);clip-path:polygon(23% 0,77% 0,91% 100%,9% 100%)}.base{width:320px;height:16px;margin:auto;border-radius:50%;background:linear-gradient(#53535a,#212124);box-shadow:0 13px 28px #000a}.phone{width:292px;margin-bottom:40px}.phone-body{position:relative;padding:8px;border:1px solid #6a6a71;border-radius:43px;background:linear-gradient(125deg,#85858d,#0c0c0e 14%,#101012 86%,#49494f);box-shadow:0 28px 60px #000b,inset 0 0 0 2px #232327}.phone img{display:block;width:100%;height:auto;border-radius:34px;background:#111}.phone-body:before{content:'';position:absolute;left:-3px;top:125px;height:70px;width:3px;background:#5b5b62;border-radius:3px}.phone-body:after{content:'';position:absolute;right:-3px;top:162px;height:51px;width:3px;background:#5b5b62;border-radius:3px}
</style>
<style>
.phone-screen{position:relative}.phone-screen:after{content:'';position:absolute;bottom:8px;left:36%;width:28%;height:3px;background:#ddd;border-radius:3px}.ios-nav{position:absolute;left:9px;right:9px;bottom:26px;display:flex;padding:4px;background:#29292ce8;border:1px solid #414145;border-radius:26px;backdrop-filter:blur(10px)}.ios-nav span{display:flex;flex:1;min-width:0;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;color:#aaa;font:500 7px 'Golos Text',sans-serif}.ios-nav .active{background:#414144;border-radius:23px;color:#eee}.ios-nav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
<style>
.phone-screen{overflow:hidden;border-radius:34px;background:#111}.phone .phone-screen img{border-radius:0 0 33px 33px}.statusbar{height:38px;display:flex;align-items:center;justify-content:space-between;padding:7px 11px 3px;background:#111;font:600 11px Manrope,sans-serif;color:#eee}.status-time{width:45px}.status-pill{display:flex;align-items:center;justify-content:center;gap:4px;border:1px solid #303035;border-radius:18px;background:#050506;width:92px;height:24px;font:700 8px 'Golos Text',sans-serif;letter-spacing:.8px}.statusbar .status-pill img{width:15px;height:15px;border-radius:4px}.status-icons{display:flex;align-items:center;gap:4px}.status-icons svg{width:14px;height:12px}.status-battery{height:9px;width:18px;border:1px solid #eee;border-radius:3px;position:relative;padding:1px}.status-battery:after{content:'';position:absolute;right:-3px;top:2px;width:2px;height:3px;background:#ddd;border-radius:1px}.status-battery i{display:block;height:5px;border-radius:1px;background:#eee}
</style>
<main class="stage"><header><img src="../../apps/ui/src-tauri/icons/icon.png" alt=""><strong>nimbo</strong></header><div class="devices">
 <section class="device monitor"><div class="label">DESKTOP</div><div class="monitor-bezel"><img id="desktop" src="./1.3.0-beta.1/desktop-home.png" alt="Desktop — главная"><div class="monitor-chin"><i></i></div></div><div class="stand"></div><div class="base"></div></section>
 <section class="device phone"><div class="label">ANDROID</div><div class="phone-body"><img id="android" src="./1.3.0-beta.1/android-home.png" alt="Android — главная"></div></section>
 <section class="device phone"><div class="label">iOS</div><div class="phone-body"><img id="ios" src="./1.3.0-beta.1/ios-compose-home.png" alt="iOS — главная"></div></section>
</div></main>
<script>
for(const id of ['android','ios']){
 const image=document.getElementById(id),screen=document.createElement('div');screen.className='phone-screen';image.replaceWith(screen);
 const status=document.createElement('div');status.className='statusbar';status.setAttribute('aria-hidden','true');
 status.innerHTML='<span class="status-time">9:41</span><span class="status-pill"><img src="../../apps/ui/src-tauri/icons/icon.png" alt="">NIMBO</span><span class="status-icons"><svg viewBox="0 0 16 12" fill="currentColor"><rect x="1" y="8" width="2" height="4" rx=".5"/><rect x="5" y="5" width="2" height="7" rx=".5"/><rect x="9" y="2" width="2" height="10" rx=".5"/><rect x="13" y="0" width="2" height="12" rx=".5"/></svg><svg viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 4a11 11 0 0 1 14 0M4 7a6 6 0 0 1 8 0M7 10h2"/></svg><span class="status-battery"><i></i></span></span>';
 screen.append(status,image);
}
if(new URLSearchParams(location.search).get('view')==='settings'){
 document.getElementById('desktop').src='./1.3.0-beta.1/desktop-mihomo.png';
 document.getElementById('desktop').alt='Desktop — группы Mihomo';
 document.getElementById('android').src='./1.3.0-beta.1/android-settings.png';
 document.getElementById('android').alt='Android — настройки';
 document.getElementById('ios').src='./1.3.0-beta.1/ios-compose-settings.png';
 document.getElementById('ios').alt='iOS — настройки';
}
const nav=document.createElement('div');nav.className='ios-nav';nav.setAttribute('aria-hidden','true');
const entries=[['Главная','M12 2v10M6 5a9 9 0 1 0 12 0'],['Профили','m3 7 9-5 9 5-9 5-9-5Zm0 5 9 5 9-5M3 17l9 5 9-5'],['Статистика','M2 12h4l3-7 4 14 3-7h6'],['Настройки','M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6']];
const active=new URLSearchParams(location.search).get('view')==='settings'?3:0;
nav.innerHTML=entries.map(([title,path],i)=>`<span class="${i===active?'active':''}"><svg viewBox="0 0 24 24"><path d="${path}"/></svg>${title}</span>`).join('');
document.getElementById('ios').parentElement.append(nav);
</script></html>
