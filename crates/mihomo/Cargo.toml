[package]
name = "nimbo-mihomo"
version = "1.3.0-beta.1"
edition = "2021"
rust-version = "1.80"
license = "Proprietary"
description = "Source-preserving profiles and supervised Nimbo native Mihomo adapter"

[dependencies]
nimbo-ipc = { path = "../ipc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4"] }
tokio = { version = "1.41", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
