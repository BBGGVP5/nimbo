name: Nimbo
options:
  bundleIdPrefix: com.nimbo.resignable
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 180
    MARKETING_VERSION: 1.3.0
    NIMBO_DISPLAY_VERSION: 1.3.0-beta.1
    NIMBO_APP_BUNDLE_ID: com.nimbo.resignable
    NIMBO_PACKET_TUNNEL_BUNDLE_ID: "$(NIMBO_APP_BUNDLE_ID).PacketTunnel"
    NIMBO_CONTROL_WIDGET_BUNDLE_ID: "$(NIMBO_APP_BUNDLE_ID).ControlWidget"
    NIMBO_LIVE_ACTIVITY_BUNDLE_ID: "$(NIMBO_APP_BUNDLE_ID).LiveActivity"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    OTHER_LDFLAGS: "$(inherited) -ObjC"

targets:
  Nimbo:
    type: application
    platform: iOS
    info:
      path: Nimbo/Info.plist
      properties:
        CFBundleDevelopmentRegion: ru
        CFBundleDisplayName: Nimbo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSLocalNetworkUsageDescription: >-
          Нужен для синхронизации подписок и настроек с компьютером или
          Android-устройством в вашей сети Wi-Fi.
        NSCameraUsageDescription: >-
          Камера нужна для сканирования QR-кодов подписок и синхронизации устройств.
        NSBonjourServices:
          - _nimbo-sync._tcp
        NimboPacketTunnelBundleIdentifier: "$(NIMBO_PACKET_TUNNEL_BUNDLE_ID)"
        NimboDisplayVersion: "$(NIMBO_DISPLAY_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Nimbo/Nimbo.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    sources:
      - path: Nimbo
      - path: Shared
      - path: NativeNotices
        type: folder
        buildPhase: resources
      - path: Branding/Branding.xcassets
        buildPhase: resources
    dependencies:
      - target: NimboPacketTunnel
        embed: true
      - target: NimboControlWidget
        embed: true
      - target: NimboLiveActivity
        embed: true
      - framework: ../shared/build/XCFrameworks/release/NimboShared.xcframework
        embed: false
      # App-side diagnostics run independently of the packet tunnel process.
      # This remains one combined Go runtime per executable, never two.
      - framework: Vendor/LibXray.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: libc++.tbd
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: CFNetwork.framework
      - sdk: MobileCoreServices.framework
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: CoreTelephony.framework
      - sdk: CryptoTokenKit.framework
      - sdk: LocalAuthentication.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(NIMBO_APP_BUNDLE_ID)"
        PRODUCT_NAME: Nimbo
        INFOPLIST_KEY_CFBundleDisplayName: Nimbo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  NimboPacketTunnel:
    type: app-extension
    platform: iOS
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDevelopmentRegion: ru
        CFBundleDisplayName: Nimbo Tunnel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    sources:
      - path: PacketTunnel
      - path: Shared
    postBuildScripts:
      - name: Bundle Xray geo databases
        script: |
          set -euo pipefail
          RESOURCE_OUTPUT="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${RESOURCE_OUTPUT}"
          cp "${SRCROOT}/build/PacketTunnelResources/geoip.dat" "${RESOURCE_OUTPUT}/geoip.dat"
          cp "${SRCROOT}/build/PacketTunnelResources/geosite.dat" "${RESOURCE_OUTPUT}/geosite.dat"
        inputFiles:
          - $(SRCROOT)/build/PacketTunnelResources/geoip.dat
          - $(SRCROOT)/build/PacketTunnelResources/geosite.dat
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/geoip.dat
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/geosite.dat
    dependencies:
      - framework: Vendor/LibXray.xcframework
        embed: false
      - sdk: libresolv.tbd
      # The final Swift link must resolve Go's Darwin x509 framework symbols.
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: libc++.tbd
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: CFNetwork.framework
      - sdk: MobileCoreServices.framework
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: CoreTelephony.framework
      - sdk: CryptoTokenKit.framework
      - sdk: LocalAuthentication.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(NIMBO_PACKET_TUNNEL_BUNDLE_ID)"
        PRODUCT_NAME: NimboPacketTunnel
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  NimboLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget:
      iOS: "16.2"
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Nimbo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: LiveActivity
      - path: Shared/NimboLiveActivityAttributes.swift
      - path: Shared/NimboLiveActivityPolicy.swift
      - path: Branding/Branding.xcassets
        buildPhase: resources
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(NIMBO_LIVE_ACTIVITY_BUNDLE_ID)"
        PRODUCT_NAME: NimboLiveActivity
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        IPHONEOS_DEPLOYMENT_TARGET: "16.2"

  NimboControlWidget:
    type: app-extension
    platform: iOS
    # Пункт управления держит элементы приложений с iOS 18, и расширение
    # объявляет ту же минимальную систему: иначе элемент приходится прятать
    # за проверкой доступности, а спрятанный так элемент система в галерее
    # не показывает. На более старых системах расширение просто не
    # активируется, приложение работает как прежде.
    deploymentTarget:
      iOS: "18.0"
    info:
      path: ControlWidget/Info.plist
      properties:
        CFBundleDisplayName: Nimbo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ControlWidget/NimboControlWidget.entitlements
      properties:
        # The control requests VPN management, not its own packet tunnel.
        # Re-signing must preserve this entitlement; actual profile access
        # from the extension still needs verification on the signed device.
        com.apple.developer.networking.vpn.api:
          - allow-vpn
    sources:
      - path: ControlWidget
      - path: Shared/NimboConstants.swift
      - path: Shared/NimboTunnelControl.swift
      - path: Shared/NimboOnDemandPolicy.swift
      - path: Shared/NimboOnDemandRules.swift
      - path: Shared/NimboAWGConfiguration.swift
      - path: Nimbo/NimboCoreSelection.swift
      - path: Shared/NimboNaiveConfiguration.swift
      - path: Branding/Branding.xcassets
        buildPhase: resources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(NIMBO_CONTROL_WIDGET_BUNDLE_ID)"
        PRODUCT_NAME: NimboControlWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        # Явно, а не только через deploymentTarget: без этого сборка
        # компилировала расширение с минимальной системой проекта, и элемент
        # Пункта управления оказывался недоступным по версии.
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"

schemes:
  Nimbo:
    build:
      targets:
        Nimbo: all
        NimboPacketTunnel: all
        NimboControlWidget: all
        NimboLiveActivity: all
    run:
      config: Debug
    archive:
      config: Release
