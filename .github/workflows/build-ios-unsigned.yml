name: Export Apple dependencies for local xtool
on:
  workflow_dispatch:
    inputs:
      version:
        description: App version
        required: true
        default: 1.3.0-beta.2
      ping_only:
        description: Unused compatibility input
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            iosApp/GoBridge/go.sum
            tools/native/awg-core/go.sum
            tools/native/naive-core/go.sum
      - name: Export source-pinned iPhone frameworks and resources
        env:
          NIMBO_VERSION: ${{ inputs.version }}
          NIMBO_BUILD_NUMBER: '181'
        run: bash scripts/ci/export-ios-xtool-dependencies.sh
      - name: Upload local-build dependencies
        uses: actions/upload-artifact@v4
        with:
          name: nimbo-xtool-dependencies-${{ github.sha }}
          path: artifacts/ios-xtool-dependencies/
          if-no-files-found: error
          retention-days: 7
