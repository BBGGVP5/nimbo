name: Публикация релиза

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег GitHub Release, например v1.1.0-beta.1"
        required: true
        type: string
      publish:
        description: "Прикрепить собранные файлы к релизу (иначе только артефакты прогона)"
        required: false
        default: false
        type: boolean
      platform:
        description: "Платформы для сборки артефактов"
        default: all
        type: choice
        options: [all, windows, linux]

env:
  NIMBO_AWG_CORE_DIR: ${{ github.workspace }}/tools/native/awg-core

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'linux'
    name: Windows x64 / x86 / ARM64
    runs-on: windows-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Python для проверки метаданных
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Проверить версии выпуска
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python tools/release/check-versions.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/release/test_stage_github_release.py

      - name: Установить Go для AmneziaWG
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: tools/native/awg-core/go.sum

      - name: Проверить зашифрованный обмен AWG
        working-directory: tools/native/awg-core
        run: go test ./... -timeout 90s

      - name: Собрать и проверить Mihomo из закреплённых исходников
        shell: pwsh
        run: |
          $goRoot = go env GOROOT
          if ($LASTEXITCODE) { throw 'Cannot locate the pinned Go toolchain' }
          & ./scripts/ci/build-mihomo-core.ps1 -GoRoot $goRoot -Python (Get-Command python).Source
          & ./apps/ui/src-tauri/native/stage-mihomo.ps1 -CoreSource ./tools/native/mihomo-core

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Кэш Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/installer/package-lock.json

      - name: Установить NSIS
        shell: powershell
        run: choco install nsis --no-progress -y

      - name: Установить зависимости интерфейса
        working-directory: apps/ui
        run: npm ci

      - name: Собрать фирменные установщики
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/installer/build-custom-installer.ps1 -All

      - name: Проверить разметку установщика без установки на runner
        working-directory: apps/installer
        run: |
          npx playwright install chromium
          npm run test:layout

      - name: Проверить откат файлов установщика
        run: cargo test --locked -p nimbo-installer --bin nimbo-installer

      - name: Проверить встроенные ядра в установщиках
        run: python tools/release/check-custom-payload.py windows-x64 windows-x86 windows-arm64

      - name: Сохранить фирменные Windows-установщики
        uses: actions/upload-artifact@v4
        with:
          name: nimbo-windows-custom
          path: target/release/bundle/custom/windows/*
          if-no-files-found: error

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    name: Linux ${{ matrix.asset_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset_arch: x64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            asset_arch: arm64
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить системные зависимости
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential file patchelf pkg-config rpm xdg-utils squashfs-tools policykit-1 libarchive-tools \
            libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Установить Python для проверки метаданных
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Проверить версии выпуска
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python tools/release/check-versions.py

      - name: Установить Go для AmneziaWG
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: tools/native/awg-core/go.sum

      - name: Проверить зашифрованный обмен AWG
        working-directory: tools/native/awg-core
        run: go test ./... -timeout 90s

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Собрать AppImage, DEB и RPM
        working-directory: apps/ui
        run: |
          npm ci
          npm run build:linux

      - name: Проверить helper во всех Linux-пакетах
        run: |
          python tools/release/test_linux_payload.py
          python tools/release/check_linux_payload.py --target '${{ matrix.target }}' --report 'release-normalized/helper-verification-${{ matrix.asset_arch }}.json'

      - name: Проверить установку и постоянный путь службы на временном runner
        run: python tools/release/test-linux-helper-install.py --target '${{ matrix.target }}'

      - name: Собрать фирменный Linux-установщик
        if: matrix.asset_arch == 'x64'
        shell: bash
        run: bash apps/installer/build-custom-linux-installer.sh --target x86_64-unknown-linux-gnu

      - name: Проверить встроенные ядра в установщике
        if: matrix.asset_arch == 'x64'
        run: python tools/release/check-custom-payload.py linux-x64

      - name: Подготовить понятные имена файлов
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p release-normalized
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          rpm="$(find target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$appimage" && test -n "$deb" && test -n "$rpm"
          cp "$appimage" "release-normalized/Nimbo_${version}_linux_${ASSET_ARCH}.AppImage"
          cp "$deb" "release-normalized/Nimbo_${version}_linux_${ASSET_ARCH}.deb"
          cp "$rpm" "release-normalized/Nimbo_${version}_linux_${ASSET_ARCH}.rpm"
          if [[ "$ASSET_ARCH" == "x64" ]]; then
            cp "target/release/bundle/custom/linux/NimboSetup_${version}_x64" release-normalized/
          fi

      - name: Сохранить Linux-пакеты
        uses: actions/upload-artifact@v4
        with:
          name: nimbo-linux-${{ matrix.asset_arch }}
          path: release-normalized/*
          if-no-files-found: error

  publish:
    name: Прикрепить файлы к GitHub Release
    needs: [windows, linux]
    # Публикация только по явному запросу; сборка тега не публикует неполный релиз.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.platform == 'all'
    runs-on: ubuntu-latest

    steps:
      - name: Скачать собранные файлы
        uses: actions/download-artifact@v4
        with:
          pattern: nimbo-*
          path: release-assets
          merge-multiple: true

      - name: Добавить контрольные суммы и загрузить файлы
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python tools/release/stage_github_release.py --assets release-assets
