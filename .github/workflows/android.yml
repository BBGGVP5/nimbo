name: Проверка Android и shared-исходников

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Shared-тесты и native source contracts
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Проверить исходники объединённого Mihomo
        run: python3 scripts/ci/test-ios-mihomo-source.py

      # The root Android project needs the pinned ~191 MB libxray.aar. It is
      # intentionally not committed; this job validates checked-in sources,
      # not an APK built against a missing native artifact.
      - name: Проверить общие Kotlin-тесты
        run: |
          chmod +x gradlew
          ./gradlew :shared:desktopTest --no-daemon --max-workers=2
