name: Check iOS ping contracts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      # Pure Swift plus loopback HTTP/SOCKS/TLS fixtures and the injected native
      # ABI seam. No Go toolchain, core download, signing or release upload.
      - name: Execute production Swift ping policies and transport contracts
        run: python3 iosApp/Tests/test_ping_contracts.py --swift
