name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios_session_contracts:
    name: iOS session policy (macOS)
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute production Swift admission, ping cache and path ownership policies
        run: python3 scripts/ci/test-ios-packet-flow.py --swift
      - name: Verify generation-safe provider and existing native ping contracts
        run: |
          python3 scripts/ci/test-ios-mihomo-source.py
          python3 iosApp/Tests/test_ping_contracts.py --swift
          python3 iosApp/Tests/test_on_demand_contracts.py --swift

  verify:
    name: Проверка (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить системные зависимости Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential file patchelf pkg-config rpm \
            libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Кэш Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/installer/package-lock.json

      - name: Собрать frontend клиента
        working-directory: apps/ui
        run: |
          npm ci
          npm test
          npm run build

      - name: Собрать frontend установщика
        working-directory: apps/installer
        run: |
          npm ci
          npm run build

      - name: Set up pinned Go for Linux Mihomo/helper source build
        if: runner.os == 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: tools/native/mihomo-core/go.sum

      - name: Подготовить проверенный Linux helper
        if: runner.os == 'Linux'
        run: node apps/ui/scripts/build-linux.mjs --prepare-only

      - name: Проверить парсеры Linux-пакетов
        if: runner.os == 'Linux'
        run: python3 tools/release/test_linux_payload.py

      - name: Запустить Rust-тесты
        run: cargo test --workspace --all-targets --exclude nimbo-installer

      - name: Проверить изолированный Xray ping на настоящем CLI
        if: runner.os == 'Linux'
        run: python3 tools/release/run-native-ping-tests.py

      - name: Проверить форматирование Rust
        run: cargo fmt --all -- --check

      - name: Запустить Clippy без предупреждений
        run: cargo clippy --workspace --all-targets --exclude nimbo-installer -- -D warnings
